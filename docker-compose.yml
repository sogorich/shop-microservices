services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    expose:
      - "8000"

  product-service-db:
    image: postgres:18.6
    container_name: product-service-db
    restart: unless-stopped
    ports:
      - 5432:5432
    env_file:
      - ./product-service/app/.env
    volumes:
      - product-service-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service-migrations:
    build: ./product-service
    working_dir: /app
    env_file:
      - ./product-service/app/.env
    command: ["alembic", "-c", "/app/app/alembic.ini", "upgrade", "head"]
    depends_on:
      product-service-db:
        condition: service_healthy
    restart: "no"

  product-service:
    build: ./product-service
    restart: unless-stopped
    env_file:
      - ./product-service/app/.env
    expose: ["8001"]
    depends_on:
      product-service-db:
        condition: service_healthy
      product-service-migrations:
        condition: service_completed_successfully

volumes:
  product-service-db-data: