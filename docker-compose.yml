services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    expose:
      - "8000"

  product-service-db:
    image: postgres:18.6
    container_name: product-service-db
    restart: unless-stopped
    ports:
      - 5432:5432
    env_file:
      - ./product-service/app/.env
    volumes:
      - product-service-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service-migrations:
    build: ./product-service
    working_dir: /app
    env_file:
      - ./product-service/app/.env
    command: ["alembic", "-c", "/app/app/alembic.ini", "upgrade", "head"]
    depends_on:
      product-service-db:
        condition: service_healthy
    restart: "no"

  product-service:
    build: ./product-service
    restart: unless-stopped
    env_file:
      - ./product-service/app/.env
    expose: ["8001"]
    depends_on:
      product-service-db:
        condition: service_healthy
      product-service-migrations:
        condition: service_completed_successfully

  order-service:
    build: ./order-service
    restart: unless-stopped
    env_file:
      - ./order-service/app/.env
    expose: ["8002"]
    depends_on:
      order-service-db:
        condition: service_healthy
      order-service-migrations:
        condition: service_completed_successfully

  order-service-db:
    image: postgres:18.6
    container_name: order-service-db
    restart: unless-stopped
    ports:
      - 5433:5432
    env_file:
      - ./order-service/app/.env
    volumes:
      - order-service-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service-migrations:
    build: ./order-service
    working_dir: /app
    env_file:
      - ./order-service/app/.env
    command: ["alembic", "-c", "/app/app/alembic.ini", "upgrade", "head"]
    depends_on:
      order-service-db:
        condition: service_healthy
    restart: "no"

  deal-service:
    build: ./deal-service
    restart: unless-stopped
    env_file:
      - ./deal-service/app/.env
    expose: ["8003"]
    depends_on:
      kafka:
        condition: service_healthy
      deal-service-db:
        condition: service_healthy
      deal-service-migrations:
        condition: service_completed_successfully

  deal-service-db:
    image: postgres:18.6
    container_name: deal-service-db
    restart: unless-stopped
    ports:
      - 5434:5432
    env_file:
      - ./deal-service/app/.env
    volumes:
      - deal-service-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  deal-service-migrations:
    build: ./deal-service
    working_dir: /app
    env_file:
      - ./deal-service/app/.env
    command: ["tortoise", "migrate"]
    depends_on:
      deal-service-db:
        condition: service_healthy
    restart: "no"

  kafka:
      image: apache/kafka:4.2.2
      container_name: kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_NUM_PARTITIONS: 3
      healthcheck:
        test:
          - CMD-SHELL
          - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1
        interval: 5s
        timeout: 10s
        retries: 30
        start_period: 30s
      volumes:
        - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
  product-service-db-data:
  order-service-db-data:
  deal-service-db-data: